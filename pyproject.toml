[project]
name = "dj-starter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "argon2-cffi>=25.1.0",
    "bpython>=0.26",
    "celery[auth,msgpack,redis]>=5.6.3",
    "channels-redis>=4.3.0",
    "channels[types]>=4.3.2",
    "dj-database-url>=3.1.2",
    "django>=6.0.5",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-cors-headers>=4.9.0",
    "django-countries>=8.2.0",
    "django-environ>=0.13.0",
    "django-filter>=25.2",
    "django-phonenumber-field[phonenumbers]>=8.4.0",
    "django-redis>=6.0.0",
    "django-silk[formatting]>=5.5.0",
    "django-storages[s3]>=1.14.6",
    "django-structlog[celery,commands]>=10.1.0",
    "django-stubs>=6.0.5",
    "django-timezone-field>=7.2.1",
    "djangorestframework>=3.17.1",
    "djangorestframework-stubs>=3.17.0",
    "drf-spectacular[sidecar]>=0.29.0",
    "gunicorn>=26.0.0",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.10.1",
    "pytz>=2026.2",
    "requests>=2.32.5",
    "ruff>=0.15.15",
    "sentry-sdk>=2.61.1",
    "types-pillow>=10.2.0.20240822",
    "types-requests>=2.33.0.20260518",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = ["pre-commit>=4.6.0", "pyclean>=3.7.0", "ty>=0.0.44"]

[tool.ruff]
line-length = 98
target-version = "py314"
extend-exclude = [
    ".venv",
    "static",
    "uploads",
    "locale",
    "migrations",
    ".github",
    "staticfiles",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules

]
ignore = [
    "RUF012", # mutable class attributes: noisy for Django/DRF Meta classes
    "B009",   # do not call getattr with a constant attribute value
    "B010",   # do not call setattr with a constant attribute value
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "N806", "RUF012"]
".github/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["core", "user"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
